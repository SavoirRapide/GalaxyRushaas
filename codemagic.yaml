workflows:
  ios-capacitor-workflow:
    name: Galaxy Rush iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreGalaxyRush

    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.a2games.galaxyrush
      vars:
        # ID AdMob de l'application iOS (Production)
        ADMOB_APP_ID: "ca-app-pub-2409581870901167~7654643904"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npm run build || echo "No build script found"

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Configure AdMob & iOS Versioning
        script: |
          cd ios/App/App
          
          # 1. Injection/Update de l'ID AdMob
          # On supprime d'abord pour éviter les doublons, puis on ajoute
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" Info.plist

          # 2. Mise à jour de la version vers 1.0.5
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.5" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          
          echo "✅ Info.plist mis à jour (Version 1.0.5 / ID AdMob injecté)"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            xcode-project build-ipa \
              --workspace "$WORKSPACE" \
              --scheme App
          elif [ -n "$PROJECT" ]; then
            xcode-project build-ipa \
              --project "$PROJECT" \
              --scheme App
          else
            echo "❌ No .xcworkspace or .xcodeproj found"
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/build/artifacts/*.ipa
      - "*.ipa"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
