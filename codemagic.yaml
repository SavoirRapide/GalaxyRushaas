workflows:
  ios-capacitor-workflow:
    name: Galaxy Rush iOS Build 0.6.0
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreGalaxyRush

    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.a2games.galaxyrush
      vars:
        # Ton ID AdMob iOS de production (APP ID)
        ADMOB_APP_ID: "ca-app-pub-2409581870901167~7654643904"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npm run build || echo "⚠️ No build script found, skipping..."

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Configure AdMob, Privacy & SKAdNetwork
        script: |
          cd ios/App/App
          
          # 1. Injection ID AdMob (Vérifier que c'est bien l'APP ID avec le ~)
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" Info.plist

          # 2. Force le mode AdMob (vs Ad Manager)
          /usr/libexec/PlistBuddy -c "Delete :GADIsAdManagerApp" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADIsAdManagerApp bool false" Info.plist

          # 3. Texte de la popup d'autorisation de suivi (ATT)
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string Cette application utilise des identifiants pour vous proposer des publicités personnalisées et mesurer leur efficacité." Info.plist

          # 4. SKAdNetwork Multi-Réseaux (Vital pour le remplissage iOS)
          /usr/libexec/PlistBuddy -c "Delete :SKAdNetworkItems" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" Info.plist
          
          # Liste des principaux réseaux (Google, AppLovin, UnityAds, IronSource)
          # Google
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" Info.plist
          # AppLovin
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:1 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:1:SKAdNetworkIdentifier string 4fzdc2evr5.skadnetwork" Info.plist
          # UnityAds
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:2 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:2:SKAdNetworkIdentifier string 4dzt52r2t5.skadnetwork" Info.plist
          # IronSource
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:3 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:3:SKAdNetworkIdentifier string su67r6k2v3.skadnetwork" Info.plist

          # 5. Mise à jour version vers 0.6.0
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.6.0" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          
          echo "✅ Info.plist (AdMob & SKAdNetwork) configuré avec succès"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
          elif [ -n "$PROJECT" ]; then
            xcode-project build-ipa --project "$PROJECT" --scheme App
          else
            echo "❌ No .xcworkspace or .xcodeproj found"
            exit 1
          fi

    artifacts:
      - ios/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/build/artifacts/*.ipa
      - "*.ipa"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
