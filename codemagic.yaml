workflows:
  ios-capacitor-workflow:
    name: Galaxy Rush iOS 1.0.5 + Firebase
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreGalaxyRush

    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.a2games.galaxyrush
      vars:
        ADMOB_APP_ID: "ca-app-pub-2409581870901167~7654643904"

    scripts:
      - name: Install dependencies
        script: |
          npm install
          # On s'assure que le plugin Firebase Capacitor est là
          npm install @capacitor-firebase/app

      - name: Build web assets
        script: |
          npm run build

      - name: Sync Capacitor & Install CocoaPods
        script: |
          npx cap sync ios
          # TRÈS IMPORTANT : C'est ici qu'on installe le SDK Firebase iOS (le code Swift que tu as vu)
          cd ios/App && pod install --repo-update

      - name: Configure AdMob, Privacy & Versions
        script: |
          cd ios/App/App
          
          # Injection ID AdMob
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" Info.plist

          # ATT & SKAdNetwork (Tes réglages actuels)
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string Cette application utilise des identifiants pour vous proposer des publicités personnalisées." Info.plist
          
          /usr/libexec/PlistBuddy -c "Delete :SKAdNetworkItems" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" Info.plist

          # Version 1.0.5
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.5" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          # Le fichier GoogleService-Info.plist doit être dans ios/App/App/
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App

    artifacts:
      - ios/build/ios/ipa/*.ipa
      - "*.ipa"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
