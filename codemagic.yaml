workflows:
  ios-capacitor-workflow:
    name: Galaxy Rush iOS Build 1.0.5
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreGalaxyRush

    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.a2games.galaxyrush
      vars:
        ADMOB_APP_ID: "ca-app-pub-2409581870901167~7654643904"

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor-firebase/app

      - name: Build web assets
        script: |
          npm run build || echo "⚠️ No build script found, skipping..."

      - name: Sync Capacitor
        script: |
          # On synchronise. Capacitor s'occupe de Firebase tout seul avec SPM.
          npx cap sync ios

      - name: Configure Info.plist (AdMob & Versions)
        script: |
          cd ios/App/App
          
          # Injection ID AdMob
          /usr/libexec/PlistBuddy -c "Delete :GADApplicationIdentifier" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $ADMOB_APP_ID" Info.plist
          /usr/libexec/PlistBuddy -c "Delete :GADIsAdManagerApp" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADIsAdManagerApp bool false" Info.plist

          # Tracking Privacy
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string Cette application utilise des identifiants pour vous proposer des publicités personnalisées et mesurer leur efficacité." Info.plist

          # SKAdNetwork
          /usr/libexec/PlistBuddy -c "Delete :SKAdNetworkItems" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:1 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:1:SKAdNetworkIdentifier string 4fzdc2evr5.skadnetwork"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:2 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:2:SKAdNetworkIdentifier string 2fnua5tdw4.skadnetwork"
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:3 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:3:SKAdNetworkIdentifier string su67r6k2v3.skadnetwork"

          # Versioning
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.5" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist

          echo "✅ Info.plist configuré"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          cd ios
          # On cherche le workspace généré par SPM
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App

    artifacts:
      - ios/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - "*.ipa"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
